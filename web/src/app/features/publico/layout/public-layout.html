<div class="min-h-screen flex flex-col bg-gray-50 text-gray-900">
  <!-- Barra de navegación fija (mobile-first) -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-sm border-b border-gray-200/80 shadow-2xs">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
      <!-- Marca / Logo -->
      <a routerLink="/" class="flex items-center gap-2.5 group focus:outline-none">
        <div class="w-9 h-9 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-bold text-sm shadow-sm shadow-indigo-200 group-hover:bg-indigo-700 transition-colors">
          OS
        </div>
        <div class="leading-tight">
          <span class="block text-base font-bold text-gray-900 tracking-tight">OniiChan Store</span>
          <span class="hidden sm:block text-[11px] text-gray-500">Merchandising y coleccionables</span>
        </div>
      </a>

      <!-- Acciones de navegación -->
      <nav class="flex items-center gap-2 sm:gap-3" aria-label="Navegación principal">
        <a
          routerLink="/"
          routerLinkActive="text-indigo-600 bg-indigo-50"
          [routerLinkActiveOptions]="{ exact: true }"
          class="px-3 py-2 rounded-xl text-sm font-medium text-gray-700 hover:text-indigo-600 hover:bg-gray-100 transition-colors"
        >
          Catálogo
        </a>

        <a
          routerLink="/carrito"
          routerLinkActive="bg-indigo-600 text-white border-indigo-600 shadow-sm shadow-indigo-200"
          class="relative inline-flex items-center gap-2 px-3.5 py-2 rounded-xl text-sm font-medium border border-gray-200 bg-white text-gray-800 hover:border-indigo-300 hover:text-indigo-600 transition-colors"
          aria-label="Ver carrito"
        >
          <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <circle cx="9" cy="21" r="1" />
            <circle cx="20" cy="21" r="1" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
          </svg>
          <span class="hidden sm:inline">Carrito</span>
          @if (carrito.cantidadTotal() > 0) {
            <span class="inline-flex items-center justify-center min-w-5 h-5 px-1.5 text-[11px] font-bold rounded-full bg-rose-500 text-white">
              {{ carrito.cantidadTotal() }}
            </span>
          }
        </a>
      </nav>
    </div>
  </header>

  <!-- Contenido principal -->
  <main class="flex-1">
    <router-outlet />
  </main>

  <!-- Pie de página -->
  <footer class="bg-white border-t border-gray-200/80 mt-12">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-6 flex flex-col sm:flex-row items-center justify-between gap-2 text-xs text-gray-500">
      <p>© OniiChan Store — Catálogo en línea</p>
      <a routerLink="/admin/login" class="text-gray-400 hover:text-gray-600 transition-colors">
        Acceso administración
      </a>
    </div>
  </footer>
</div>
