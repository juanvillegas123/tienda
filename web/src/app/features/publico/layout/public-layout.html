<div class="min-h-screen flex flex-col bg-fondo text-negro font-sans overflow-x-clip">
  <!-- Encabezado fijo -->
  <header class="sticky top-0 z-40 bg-negro text-perla border-b-2 border-carmesi">
    <div class="mx-auto w-full max-w-7xl px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
      <!-- Logo circular -->
      <a
        routerLink="/"
        class="flex items-center gap-3 group rounded-full pr-2 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-carmesi focus-visible:ring-offset-2 focus-visible:ring-offset-negro"
      >
        @if (!logoFallido()) {
          <img
            src="img/logo.png"
            alt="OniiChan Store"
            (error)="onErrorLogo()"
            class="h-10 w-10 rounded-full object-cover bg-white shrink-0 ring-1 ring-perla/20"
          />
        } @else {
          <div class="h-10 w-10 rounded-full bg-carmesi text-perla flex items-center justify-center font-display text-lg tracking-wider shrink-0 ring-1 ring-perla/20 group-hover:bg-carmesi-claro transition-colors">
            OS
          </div>
        }
        <div class="leading-none">
          <span class="block font-display text-xl sm:text-2xl uppercase tracking-wider text-perla">
            OniiChan Store
          </span>
          <span class="hidden sm:block text-[10px] uppercase tracking-[0.2em] text-perla/65 mt-0.5">
            Calidad en figuras
          </span>
        </div>
      </a>

      <!-- Navegación derecha -->
      <nav class="flex items-center gap-2 sm:gap-3" aria-label="Navegación principal">
        <a
          routerLink="/"
          routerLinkActive
          #rlaCatalogo="routerLinkActive"
          [routerLinkActiveOptions]="{ exact: true }"
          [class]="rlaCatalogo.isActive
            ? 'px-3 py-2 rounded-full text-sm font-semibold text-perla bg-vino border border-carmesi/70 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-carmesi'
            : 'px-3 py-2 rounded-full text-sm font-medium text-perla/85 hover:text-perla hover:bg-white/8 border border-transparent transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-carmesi'"
        >
          Catálogo
        </a>

        <a
          routerLink="/carrito"
          routerLinkActive
          #rlaCarrito="routerLinkActive"
          [class]="rlaCarrito.isActive
            ? 'inline-flex items-center gap-2 px-3.5 py-2 rounded-full text-sm font-semibold border bg-carmesi text-perla border-carmesi-claro transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-carmesi focus-visible:ring-offset-2 focus-visible:ring-offset-negro'
            : 'inline-flex items-center gap-2 px-3.5 py-2 rounded-full text-sm font-semibold border bg-white/8 text-perla border-perla/20 hover:border-carmesi-claro hover:bg-vino-oscuro transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-carmesi focus-visible:ring-offset-2 focus-visible:ring-offset-negro'"
          aria-label="Ver carrito de compras"
        >
          <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="9" cy="21" r="1" />
            <circle cx="20" cy="21" r="1" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
          </svg>
          <span>Carrito</span>
          @if (carrito.cantidadTotal() > 0) {
            <span
              class="inline-flex items-center justify-center min-w-5 h-5 px-1.5 text-[11px] font-bold tabular-nums rounded-full"
              [class]="rlaCarrito.isActive ? 'bg-negro text-perla' : 'bg-carmesi text-perla'"
            >
              {{ carrito.cantidadTotal() }}
            </span>
          }
        </a>
      </nav>
    </div>
  </header>

  <!-- Contenido principal -->
  <main class="flex-1">
    <router-outlet />
  </main>

  <!-- Pie de página (negro, logo, lema, sin enlace de administración) -->
  <footer class="bg-negro text-perla border-t border-vino mt-12">
    <div class="mx-auto w-full max-w-7xl px-4 sm:px-6 py-7 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        @if (!logoFallido()) {
          <img
            src="img/logo.png"
            alt="OniiChan Store"
            loading="lazy"
            decoding="async"
            (error)="onErrorLogo()"
            class="h-9 w-9 rounded-full object-cover bg-white shrink-0 ring-1 ring-perla/20"
          />
        } @else {
          <div class="h-9 w-9 rounded-full bg-carmesi text-perla flex items-center justify-center font-display text-base tracking-wider shrink-0">
            OS
          </div>
        }
        <div>
          <p class="font-display text-lg uppercase tracking-wider text-perla leading-none">
            Calidad en figuras
          </p>
          <p class="text-xs text-perla/65 mt-0.5">© OniiChan Store — Todos los derechos reservados.</p>
        </div>
      </div>

      <div class="flex items-center gap-2 text-xs text-perla/60">
        <svg class="w-3.5 h-3.5 text-carmesi-claro" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z" />
        </svg>
        <span>Vitrina de coleccionista</span>
      </div>
    </div>
  </footer>
</div>
