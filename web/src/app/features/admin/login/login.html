<div class="min-h-screen bg-fondo flex items-center justify-center p-4 font-sans">
  <div class="w-full max-w-sm">
    <!-- Cabecera con marca oficial -->
    <div class="text-center mb-7">
      <img
        src="img/logo-96.png"
        alt="Logo de Onii-Chan Store"
        width="64"
        height="64"
        class="h-16 w-16 rounded-full object-cover bg-white mx-auto mb-3 shadow-sm ring-2 ring-carmesi/25"
      />
      <h1 class="font-display text-3xl uppercase tracking-wider text-negro leading-none">
        Onii-Chan Store
      </h1>
      <p class="text-xs uppercase tracking-[0.18em] text-negro/55 mt-1.5">Panel de administración</p>
    </div>

    <!-- Tarjeta de login -->
    <div class="bg-tarjeta rounded-2xl shadow-sm border border-black/10 p-8">
      <h2 class="text-base font-bold text-negro mb-5">Iniciar sesión</h2>

      @if (error()) {
        <div class="mb-4 p-3 rounded-xl bg-peligro-suave border border-peligro-borde text-peligro text-sm">
          {{ error() }}
        </div>
      }

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4" novalidate>
        <div>
          <label for="usuario" class="block text-sm font-medium text-negro/80 mb-1">
            Usuario
          </label>
          <input
            id="usuario"
            type="text"
            formControlName="usuario"
            autocomplete="username"
            class="w-full px-3.5 py-2.5 border border-black/15 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-carmesi focus:border-carmesi disabled:opacity-50"
            [class.border-red-500]="campoInvalido('usuario')"
            placeholder="Nombre de usuario"
          />
          @if (campoInvalido('usuario')) {
            <p class="mt-1 text-xs text-peligro">El usuario es requerido</p>
          }
        </div>

        <div>
          <label for="contrasena" class="block text-sm font-medium text-negro/80 mb-1">
            Contraseña
          </label>
          <input
            id="contrasena"
            type="password"
            formControlName="contrasena"
            autocomplete="current-password"
            class="w-full px-3.5 py-2.5 border border-black/15 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-carmesi focus:border-carmesi disabled:opacity-50"
            [class.border-red-500]="campoInvalido('contrasena')"
            placeholder="Contraseña"
          />
          @if (campoInvalido('contrasena')) {
            <p class="mt-1 text-xs text-peligro">La contraseña es requerida</p>
          }
        </div>

        <button
          type="submit"
          [disabled]="cargando()"
          class="w-full py-2.5 px-4 bg-carmesi hover:bg-carmesi-claro disabled:opacity-60 disabled:cursor-not-allowed text-perla font-semibold rounded-xl text-sm transition-colors focus:outline-none focus:ring-2 focus:ring-carmesi focus:ring-offset-2 mt-2 cursor-pointer"
        >
          @if (cargando()) {
            <span class="inline-flex items-center gap-2">
              <svg class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
              </svg>
              Ingresando…
            </span>
          } @else {
            Ingresar
          }
        </button>
      </form>
    </div>
  </div>
</div>
