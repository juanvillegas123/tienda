<div class="min-h-screen bg-gray-50 flex items-center justify-center p-4">
  <div class="w-full max-w-sm">
    <!-- Cabecera -->
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-gray-900">OnniChan Store</h1>
      <p class="text-sm text-gray-500 mt-1">Panel de administración</p>
    </div>

    <!-- Tarjeta de login -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-8">
      <h2 class="text-lg font-semibold text-gray-800 mb-6">Iniciar sesión</h2>

      <!-- Mensaje de error -->
      @if (error()) {
        <div class="mb-4 p-3 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm">
          {{ error() }}
        </div>
      }

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4" novalidate>
        <!-- Usuario -->
        <div>
          <label for="usuario" class="block text-sm font-medium text-gray-700 mb-1">
            Usuario
          </label>
          <input
            id="usuario"
            type="text"
            formControlName="usuario"
            autocomplete="username"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent disabled:opacity-50"
            [class.border-red-400]="campoInvalido('usuario')"
            placeholder="Nombre de usuario"
          />
          @if (campoInvalido('usuario')) {
            <p class="mt-1 text-xs text-red-600">El usuario es requerido</p>
          }
        </div>

        <!-- Contraseña -->
        <div>
          <label for="contrasena" class="block text-sm font-medium text-gray-700 mb-1">
            Contraseña
          </label>
          <input
            id="contrasena"
            type="password"
            formControlName="contrasena"
            autocomplete="current-password"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent disabled:opacity-50"
            [class.border-red-400]="campoInvalido('contrasena')"
            placeholder="Contraseña"
          />
          @if (campoInvalido('contrasena')) {
            <p class="mt-1 text-xs text-red-600">La contraseña es requerida</p>
          }
        </div>

        <!-- Botón -->
        <button
          type="submit"
          [disabled]="cargando()"
          class="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-60 disabled:cursor-not-allowed text-white font-medium rounded-lg text-sm transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 mt-2"
        >
          @if (cargando()) {
            <span class="inline-flex items-center gap-2">
              <svg class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
              </svg>
              Ingresando…
            </span>
          } @else {
            Ingresar
          }
        </button>
      </form>
    </div>
  </div>
</div>
