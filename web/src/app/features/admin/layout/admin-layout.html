<div class="flex h-screen bg-gray-100 overflow-hidden">
  <!-- Sidebar -->
  <aside class="w-56 bg-white border-r border-gray-200 flex flex-col">
    <!-- Logo -->
    <div class="px-4 py-5 border-b border-gray-100">
      <h1 class="text-base font-bold text-gray-900 leading-tight">OnniChan Store</h1>
      <p class="text-xs text-gray-400 mt-0.5">Panel admin</p>
    </div>

    <!-- Navegación -->
    <nav class="flex-1 py-4 overflow-y-auto">
      <ul class="space-y-0.5 px-2">
        @for (item of navItems; track item.ruta) {
          <li>
            <a
              [routerLink]="item.ruta"
              routerLinkActive="bg-indigo-50 text-indigo-700 font-medium"
              [routerLinkActiveOptions]="{ exact: false }"
              class="flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm text-gray-600 hover:bg-gray-50 hover:text-gray-900 transition-colors"
            >
              <span class="text-base">{{ item.icono }}</span>
              {{ item.nombre }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <!-- Usuario + Logout -->
    <div class="p-4 border-t border-gray-100">
      @if (sesion()) {
        <p class="text-xs text-gray-500 mb-2 truncate">{{ sesion()!.usuario }}</p>
      }
      <button
        (click)="cerrarSesion()"
        class="w-full text-left text-sm text-red-600 hover:text-red-700 py-1 px-2 rounded hover:bg-red-50 transition-colors"
      >
        Cerrar sesión
      </button>
    </div>
  </aside>

  <!-- Contenido principal -->
  <main class="flex-1 overflow-y-auto">
    <router-outlet />
  </main>
</div>
