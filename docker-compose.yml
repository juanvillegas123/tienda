services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: oniichan-api
    restart: unless-stopped
    env_file:
      - ./api/.env
    environment:
      NODE_ENV: production
      PORT: 3000
    networks:
      - red_tienda

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: oniichan-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      # Cambia WEB_PORT al levantar (por ejemplo WEB_PORT=8440) para usar el puerto que prefieras
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - red_tienda

networks:
  red_tienda:
    driver: bridge
